<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoverbox</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        body{
            margin: 0%;
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            background:linear-gradient(135deg,rgb(93, 127, 189),rgb(205, 135, 147),rgb(160, 67, 67),rgb(82, 165, 65))

        }
        .container{
            display: flex;
            gap: 30px;
        }
       
         .C{
            height: 200px;
            width: 200px;
            margin-top: 100px;
            background :linear-gradient(rgb(104, 68, 104),rgb(201, 121, 134));
            border-radius: 20px;
            display: flex;align-items: center;
            font-size: 20px;
            transition: 0.6s;
            cursor: pointer;
            box-shadow: 0 5px 15px ;
         } 
          .C:hover{
            transform: scale(1.1)rotate(2deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            
        }
        .c1{
            background:linear-gradient(45deg,#ff6b6b,#ff9f43);
        }
        .c2{
            background:linear-gradient(45deg,#e3bd27,#2a82c5);
        }
        .c3{
            background:linear-gradient(45deg,#7c1356,#1ca010);
        }
        
        

    </style>
</head>
<body>
    <div class="container">
    <div class="C c1"></div>
    <div class="C  c2"></div>
    <div class="C c3"></div>
    </div>
    
</body>
</html>
