<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(45deg,#667eea,#764ba2);
}

.container{
    display:flex;
    gap:30px;
}

.box{
    width:220px;
    height:220px;
    background:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    transition:0.6s;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.box:hover{
    transform:scale(1.1) rotateY(20deg);
    box-shadow:0 15px 30px rgba(0,0,0,0.5);
}

.box1{
    background:linear-gradient(45deg,#ff6b6b,#ff9f43);
}

.box2{
    background:linear-gradient(45deg,#1dd1a1,#54a0ff);
}

.box3{
    background:linear-gradient(45deg,#5f27cd,#c56cf0);
}
</style>
</head>
<body>

<div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
</div>

</body>
</html>
