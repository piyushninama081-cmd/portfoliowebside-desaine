<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-container {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 400px;
    border: 1px solid #e0e0e0;
}

.login-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.login-header h2 { margin: 0; color: #333; }
.login-header a { color: #3498db; text-decoration: none; }

.input-group { margin-bottom: 20px; }
.input-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
.input-group span { color: red; }

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box; /* Important for padding */
}

.checkbox-group { margin-bottom: 20px; display: flex; align-items: center; }
.checkbox-group label { margin-left: 8px; color: #555; }

.login-btn {
    width: 100%;
    padding: 12px;
    background-color: #72bf44;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover { background-color: #5ea838; }

.footer-link { text-align: center; margin-top: 20px; }
.footer-link a { color: #3498db; text-decoration: none; 

}
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Login</h2>
            <p>or <a href="#">Create an Account</a></p>
        </div>

        <form>
            <div class="input-group">
                <label>Username or email <span>*</span></label>
                <input type="text" required>
            </div>

            <div class="input-group">
                <label>Password <span>*</span></label>
                <input type="password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="footer-link">
            <a href="#">Lost your password?</a>
        </div>
    </div>

</body>
</html>
